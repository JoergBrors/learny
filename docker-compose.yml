# LearnCards — Full-Stack Docker-Betrieb (eigener Linux-Rechner)
#
#   docker compose up --build -d          # startet db + web (+ nginx im Profil "production")
#   docker compose --profile mcp run --rm mcp-server   # MCP-Server interaktiv (stdio)
#
# Installation ohne Quellcode (fertige Images von Docker Hub): deploy/docker/README.md
#
# Für lokale Entwicklung ohne Container siehe docs/local-development.md —
# `dotnet run` im Projekt src/LearnCards.Web genügt (SQLite, kein Docker nötig).

services:
  db:
    image: postgres:16-alpine
    container_name: learncards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learncards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learncards}
      POSTGRES_DB: ${POSTGRES_DB:-learncards}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learncards}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: src/LearnCards.Web/Dockerfile
    container_name: learncards-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_PROVIDER: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-learncards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learncards}
      POSTGRES_DB: ${POSTGRES_DB:-learncards}
      POSTGRES_SSLMODE: disable      # im internen Docker-Netzwerk ausreichend; für Azure s. unten "require"
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_WEB_SCOPE: ${OIDC_SCOPE:-openid profile email}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MCP_API_KEY: ${MCP_API_KEY:-change-me-mcp-key}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_TOKEN_DAYS: ${MCP_TOKEN_DAYS:-30}
      MCP_TOKEN_KEY: ${MCP_TOKEN_KEY:?MCP_TOKEN_KEY in .env setzen (openssl rand -base64 32)}   # Pflicht (ADR 0025)
      MCP_TOKEN_KEY_PREVIOUS: ${MCP_TOKEN_KEY_PREVIOUS:-}
      MCP_LEGACY_TOKEN_UNTIL: ${MCP_LEGACY_TOKEN_UNTIL:-}
      ADMIN_SUBJECTS: ${ADMIN_SUBJECTS:-}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Zertifikate/Blockchain (ADR 0021/0022): Secrets (BADGE_SIGNING_KEY_PEM) nur über die Umgebung/.env, nie im Repository
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      BADGE_SIGNING_KEY_PEM: ${BADGE_SIGNING_KEY_PEM:-}
      # PDF-Signatur der Zertifikate (ADR 0033): eigenes X.509-Zertifikat; ohne Konfiguration keine PDFs (503). Secrets nur über Umgebung/.env
      PKI_PUBLIC_URL: ${PKI_PUBLIC_URL:-}
      PKI_AUTO_INIT: ${PKI_AUTO_INIT:-true}
      PKI_KEY_PASSWORD: ${PKI_KEY_PASSWORD:-}
      PKI_ROOT_PASSPHRASE: ${PKI_ROOT_PASSPHRASE:-}
      PDF_SIGNING_CERT_FILE: ${PDF_SIGNING_CERT_FILE:-}
      PDF_SIGNING_CERT_PASSWORD: ${PDF_SIGNING_CERT_PASSWORD:-}
      PDF_SIGNING_CERT_PFX_BASE64: ${PDF_SIGNING_CERT_PFX_BASE64:-}
      BLOCKCHAIN_ENABLED: ${BLOCKCHAIN_ENABLED:-true}
      BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK:-polygon-amoy}
      BLOCKCHAIN_AUTO_ANCHOR: ${BLOCKCHAIN_AUTO_ANCHOR:-true}
      BLOCKCHAIN_MAX_COST_EUR: ${BLOCKCHAIN_MAX_COST_EUR:-0.001}
      BLOCKCHAIN_MAINNET_ENABLED: ${BLOCKCHAIN_MAINNET_ENABLED:-false}
      BLOCKCHAIN_BATCH_MAX_SIZE: ${BLOCKCHAIN_BATCH_MAX_SIZE:-100}
      BLOCKCHAIN_BATCH_MAX_WAIT_MINUTES: ${BLOCKCHAIN_BATCH_MAX_WAIT_MINUTES:-60}
      BLOCKCHAIN_WALLET_ADDRESS: ${BLOCKCHAIN_WALLET_ADDRESS:-}
      # Bildspeicher (ADR 0017/0018). Standard: database. Für "local" liegt IMAGE_LOCAL_PATH (Standard /app/data/images) auf dem Volume web_data.
      IMAGE_STORAGE_PROVIDER: ${IMAGE_STORAGE_PROVIDER:-database}
      IMAGE_LOCAL_PATH: ${IMAGE_LOCAL_PATH:-}
      IMAGE_PROXY_ENABLED: ${IMAGE_PROXY_ENABLED:-true}
      IMAGE_CACHE_ENABLED: ${IMAGE_CACHE_ENABLED:-true}
      IMAGE_CACHE_MAX_SIZE_MB: ${IMAGE_CACHE_MAX_SIZE_MB:-512}
      IMAGE_CACHE_TTL_MINUTES: ${IMAGE_CACHE_TTL_MINUTES:-1440}
      IMAGE_CACHE_PATH: ${IMAGE_CACHE_PATH:-}
      # Cloud-Provider (Secrets nur über die Umgebung/.env, nie im Repository):
      IMAGE_AZUREBLOB_ACCOUNT: ${IMAGE_AZUREBLOB_ACCOUNT:-}
      IMAGE_AZUREBLOB_CONTAINER: ${IMAGE_AZUREBLOB_CONTAINER:-learncards-images}
      IMAGE_AZUREBLOB_AUTH: ${IMAGE_AZUREBLOB_AUTH:-managedidentity}
      IMAGE_AZUREBLOB_TENANT_ID: ${IMAGE_AZUREBLOB_TENANT_ID:-}
      IMAGE_AZUREBLOB_CLIENT_ID: ${IMAGE_AZUREBLOB_CLIENT_ID:-}
      IMAGE_AZUREBLOB_CLIENT_SECRET: ${IMAGE_AZUREBLOB_CLIENT_SECRET:-}
      IMAGE_AZURE_SAS_TTL_SECONDS: ${IMAGE_AZURE_SAS_TTL_SECONDS:-60}
      IMAGE_S3_ENDPOINT: ${IMAGE_S3_ENDPOINT:-}
      IMAGE_S3_REGION: ${IMAGE_S3_REGION:-us-east-1}
      IMAGE_S3_BUCKET: ${IMAGE_S3_BUCKET:-}
      IMAGE_S3_ACCESS_KEY_ID: ${IMAGE_S3_ACCESS_KEY_ID:-}
      IMAGE_S3_SECRET_ACCESS_KEY: ${IMAGE_S3_SECRET_ACCESS_KEY:-}
      IMAGE_S3_PATH_STYLE: ${IMAGE_S3_PATH_STYLE:-false}
      IMAGE_SHAREPOINT_TENANT_ID: ${IMAGE_SHAREPOINT_TENANT_ID:-}
      IMAGE_SHAREPOINT_CLIENT_ID: ${IMAGE_SHAREPOINT_CLIENT_ID:-}
      IMAGE_SHAREPOINT_CLIENT_SECRET: ${IMAGE_SHAREPOINT_CLIENT_SECRET:-}
      IMAGE_SHAREPOINT_SITE_ID: ${IMAGE_SHAREPOINT_SITE_ID:-}
      IMAGE_SHAREPOINT_DRIVE_ID: ${IMAGE_SHAREPOINT_DRIVE_ID:-}
      DEBUG: ${DEBUG:-false}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - web_data:/app/data
    networks:
      - internal
    ports:
      - "8080:8080"    # ohne nginx direkt erreichbar; mit nginx (Profil "production") ggf. entfernen

  mcp-server:
    build:
      context: .
      dockerfile: src/LearnCards.McpServer/Dockerfile
    container_name: learncards-mcp
    profiles: ["mcp"]              # läuft nur bewusst via `--profile mcp`, stdio passt nicht zu "up -d"
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      LEARNCARDS_API_URL: http://web:8080/api
      LEARNCARDS_MCP_API_KEY: ${MCP_API_KEY:-change-me-mcp-key}
    depends_on:
      - web
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: learncards-nginx
    restart: unless-stopped
    profiles: ["production"]        # TLS-Terminierung; für reinen HTTP-Test kann web:8080 direkt genutzt werden
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:
  web_data:

networks:
  internal:
    driver: bridge
