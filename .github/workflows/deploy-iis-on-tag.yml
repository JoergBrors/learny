name: Deploy To IIS On Tag

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  WEB_PROJECT: "src/LearnCards.Web/LearnCards.Web.csproj"
  WEB_PUBLISH_DIR: "${{ github.workspace }}\\publish-web"
  WEB_PACKAGE_NAME: "learncards-web-${{ github.ref_name }}.zip"
  MCP_PROJECT: "src/LearnCards.McpServer/LearnCards.McpServer.csproj"
  MCP_PUBLISH_DIR: "${{ github.workspace }}\\publish-mcp"
  MCP_PACKAGE_NAME: "learncards-mcp-${{ github.ref_name }}.zip"

jobs:
  build:
    name: Build Publish Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Web App
        shell: pwsh
        run: |
          dotnet publish "${{ env.WEB_PROJECT }}" `
            -c Release `
            -o "${{ env.WEB_PUBLISH_DIR }}"

      - name: Publish MCP Server
        shell: pwsh
        run: |
          dotnet publish "${{ env.MCP_PROJECT }}" `
            -c Release `
            -o "${{ env.MCP_PUBLISH_DIR }}"

      - name: Create Web Deployment Package
        shell: pwsh
        run: |
          if (Test-Path "${{ env.WEB_PACKAGE_NAME }}") {
            Remove-Item -LiteralPath "${{ env.WEB_PACKAGE_NAME }}" -Force
          }
          Compress-Archive -Path "${{ env.WEB_PUBLISH_DIR }}\\*" -DestinationPath "${{ env.WEB_PACKAGE_NAME }}"

      - name: Create MCP Deployment Package
        shell: pwsh
        run: |
          if (Test-Path "${{ env.MCP_PACKAGE_NAME }}") {
            Remove-Item -LiteralPath "${{ env.MCP_PACKAGE_NAME }}" -Force
          }
          Compress-Archive -Path "${{ env.MCP_PUBLISH_DIR }}\\*" -DestinationPath "${{ env.MCP_PACKAGE_NAME }}"

      - name: Upload Web Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: iis-package
          path: ${{ env.WEB_PACKAGE_NAME }}
          if-no-files-found: error

      - name: Upload MCP Deployment Package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: ${{ env.MCP_PACKAGE_NAME }}
          if-no-files-found: error

  deploy:
    name: Deploy On IIS
    runs-on:
      - self-hosted
      - Windows
      - X64
    needs: build
    environment: Lerny
    env:
      PACKAGE_ROOT: "${{ github.workspace }}\\_deploy"
      IIS_SITE_NAME: ${{ vars.IIS_SITE_NAME }}
      IIS_APP_POOL: ${{ vars.IIS_APP_POOL }}
      IIS_PHYSICAL_PATH: ${{ vars.IIS_PHYSICAL_PATH }}
      IIS_BINDING_URL: ${{ vars.IIS_BINDING_URL }}
      IIS_PORT: ${{ vars.IIS_PORT }}
      IIS_HOST_HEADER: ${{ vars.IIS_HOST_HEADER }}
      ASPNETCORE_HOSTING_BUNDLE_URL: ${{ vars.ASPNETCORE_HOSTING_BUNDLE_URL }}
      MCP_PHYSICAL_PATH: ${{ vars.MCP_PHYSICAL_PATH }}
      MCP_SERVICE_NAME: ${{ vars.MCP_SERVICE_NAME }}
      MCP_HTTP_HEALTH_URL: ${{ vars.MCP_HTTP_HEALTH_URL }}
      DEPLOY_APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      DEPLOY_DEBUG: ${{ vars.DEBUG }}
      DEPLOY_DB_PROVIDER: ${{ vars.DB_PROVIDER }}
      DEPLOY_SQLITE_PATH: ${{ vars.SQLITE_PATH }}
      DEPLOY_POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      DEPLOY_POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      DEPLOY_POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      DEPLOY_POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      DEPLOY_POSTGRES_SSLMODE: ${{ vars.POSTGRES_SSLMODE }}
      DEPLOY_AUTH_MODE: ${{ vars.AUTH_MODE }}
      DEPLOY_OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
      DEPLOY_OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      DEPLOY_OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
      DEPLOY_OIDC_WEB_SCOPE: ${{ vars.OIDC_WEB_SCOPE }}
      DEPLOY_OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      DEPLOY_OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      DEPLOY_DEV_USER_NAME: ${{ vars.DEV_USER_NAME }}
      DEPLOY_DEV_USER_EMAIL: ${{ vars.DEV_USER_EMAIL }}
      DEPLOY_MCP_SERVER_NAME: ${{ vars.MCP_SERVER_NAME }}
      DEPLOY_MCP_SERVER_VERSION: ${{ vars.MCP_SERVER_VERSION }}
      DEPLOY_MCP_UPSTREAM_API_BASE_URL: ${{ vars.MCP_UPSTREAM_API_BASE_URL }}
      DEPLOY_MCP_STDIO_ENABLED: ${{ vars.MCP_STDIO_ENABLED }}
      DEPLOY_MCP_HTTP_ENABLED: ${{ vars.MCP_HTTP_ENABLED }}
      DEPLOY_MCP_HTTP_URLS_JSON: ${{ vars.MCP_HTTP_URLS_JSON }}
      DEPLOY_MCP_OAUTH_ENABLED: ${{ vars.MCP_OAUTH_ENABLED }}
      DEPLOY_MCP_OAUTH_ISSUER: ${{ vars.MCP_OAUTH_ISSUER }}
      DEPLOY_MCP_OAUTH_AUDIENCE: ${{ vars.MCP_OAUTH_AUDIENCE }}
      DEPLOY_MCP_OAUTH_TOKEN_LIFETIME_MINUTES: ${{ vars.MCP_OAUTH_TOKEN_LIFETIME_MINUTES }}
      DEPLOY_MCP_OAUTH_CLIENT_ID: ${{ vars.MCP_OAUTH_CLIENT_ID }}
      DEPLOY_MCP_OAUTH_CLIENT_SCOPES_JSON: ${{ vars.MCP_OAUTH_CLIENT_SCOPES_JSON }}
      DEPLOY_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DEPLOY_OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      DEPLOY_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEPLOY_MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      DEPLOY_MCP_OAUTH_SIGNING_KEY: ${{ secrets.MCP_OAUTH_SIGNING_KEY }}
      DEPLOY_MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Deployment Package
        uses: actions/download-artifact@v4
        with:
          name: iis-package
          path: ${{ env.PACKAGE_ROOT }}\web

      - name: Download MCP Deployment Package
        uses: actions/download-artifact@v4
        with:
          name: mcp-package
          path: ${{ env.PACKAGE_ROOT }}\mcp

      - name: Diagnose Runner And IIS Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          function Add-SummaryLine {
            param([string]$Text)
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $Text
          }

          Add-SummaryLine "## Deployment diagnostics"
          Add-SummaryLine ""
          Add-SummaryLine "- Timestamp: $(Get-Date -Format s)"
          Add-SummaryLine "- Computer: $env:COMPUTERNAME"
          Add-SummaryLine "- User: $env:USERNAME"
          Add-SummaryLine "- User domain: $env:USERDOMAIN"
          Add-SummaryLine "- PowerShell edition: $($PSVersionTable.PSEdition)"
          Add-SummaryLine "- PowerShell version: $($PSVersionTable.PSVersion)"

          Write-Host "=== PowerShell ==="
          $PSVersionTable

          Write-Host "=== Runner service ==="
          $runnerServices = Get-CimInstance Win32_Service | Where-Object { $_.Name -like 'actions.runner*' } |
            Select-Object Name, StartName, State
          if ($runnerServices) {
            $runnerServices | Format-Table -AutoSize | Out-String | Write-Host
            foreach ($service in $runnerServices) {
              Add-SummaryLine "- Runner service: $($service.Name) / account: $($service.StartName) / state: $($service.State)"
            }
          }
          else {
            Write-Warning "Kein GitHub Runner-Dienst gefunden."
            Add-SummaryLine "- Runner service: not found"
          }

          Write-Host "=== Windows features ==="
          $features = Get-WindowsFeature Web-Server, Web-Mgmt-Tools, Web-Scripting-Tools |
            Select-Object Name, InstallState
          $features | Format-Table -AutoSize | Out-String | Write-Host
          foreach ($feature in $features) {
            Add-SummaryLine "- Feature $($feature.Name): $($feature.InstallState)"
          }

          Write-Host "=== Local administrators ==="
          try {
            $admins = Get-LocalGroupMember Administrators | Select-Object Name, PrincipalSource, ObjectClass
            $admins | Format-Table -AutoSize | Out-String | Write-Host
            Add-SummaryLine "- Local Administrators group listed successfully"
          }
          catch {
            Write-Warning "Lokale Administratoren konnten nicht gelesen werden: $($_.Exception.Message)"
            Add-SummaryLine "- Local Administrators group: read failed"
          }

          Write-Host "=== IIS module ==="
          try {
            Import-Module WebAdministration -ErrorAction Stop
            Write-Host "WebAdministration imported."
            Add-SummaryLine "- WebAdministration import: ok"
          }
          catch {
            Write-Error "WebAdministration import failed: $($_.Exception.Message)"
            Add-SummaryLine "- WebAdministration import: failed"
          }

          $iisDrive = Get-PSDrive -Name IIS -ErrorAction SilentlyContinue
          if ($iisDrive) {
            Write-Host "IIS drive available."
            Add-SummaryLine "- IIS drive: available"
            try {
              $appPools = Get-ChildItem IIS:\AppPools | Select-Object -First 10 Name, State
              $appPools | Format-Table -AutoSize | Out-String | Write-Host
              Add-SummaryLine "- IIS AppPools query: ok"
            }
            catch {
              Write-Warning "IIS AppPools konnten nicht gelesen werden: $($_.Exception.Message)"
              Add-SummaryLine "- IIS AppPools query: failed"
            }
          }
          else {
            Write-Warning "IIS drive nicht vorhanden."
            Add-SummaryLine "- IIS drive: missing"
          }

          Write-Host "=== Deployment env overview ==="
          foreach ($name in @(
            "IIS_SITE_NAME",
            "IIS_APP_POOL",
            "IIS_PHYSICAL_PATH",
            "IIS_BINDING_URL",
            "MCP_PHYSICAL_PATH",
            "MCP_SERVICE_NAME",
            "DEPLOY_DB_PROVIDER",
            "DEPLOY_AUTH_MODE",
            "DEPLOY_MCP_SERVER_NAME",
            "DEPLOY_MCP_SERVER_VERSION",
            "DEPLOY_MCP_STDIO_ENABLED",
            "DEPLOY_MCP_HTTP_ENABLED"
          )) {
            $value = (Get-Item -Path "Env:$name" -ErrorAction SilentlyContinue).Value
            $state = if ([string]::IsNullOrWhiteSpace($value)) { "missing" } else { "set" }
            Write-Host ("{0}: {1}" -f $name, $state)
            Add-SummaryLine ("- {0}: {1}" -f $name, $state)
          }

      - name: Render Runtime Config From Secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($required in @(
            "DEPLOY_DB_PROVIDER",
            "DEPLOY_AUTH_MODE",
            "DEPLOY_MCP_SERVER_NAME",
            "DEPLOY_MCP_SERVER_VERSION",
            "DEPLOY_MCP_UPSTREAM_API_BASE_URL",
            "DEPLOY_MCP_STDIO_ENABLED",
            "DEPLOY_MCP_HTTP_ENABLED"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -Path "Env:$required" -ErrorAction SilentlyContinue).Value)) {
              throw "Pflichtwert '$required' fehlt. Bitte GitHub Variables konfigurieren."
            }
          }

          $renderRoot = Join-Path $env:PACKAGE_ROOT "rendered-config"
          if (Test-Path -LiteralPath $renderRoot) {
            Remove-Item -LiteralPath $renderRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $renderRoot -Force | Out-Null

          function Render-File {
            param(
              [string]$SourcePath,
              [string]$TargetPath,
              [hashtable]$Tokens
            )

            $content = Get-Content -LiteralPath $SourcePath -Raw
            foreach ($entry in $Tokens.GetEnumerator()) {
              $replacement = if ($null -eq $entry.Value) { "" } else { [string]$entry.Value }
              $content = $content.Replace($entry.Key, $replacement)
            }
            Set-Content -LiteralPath $TargetPath -Value $content -Encoding UTF8
          }

          $webTemplate = Join-Path $env:GITHUB_WORKSPACE "deploy\iis\web.env"
          $webTarget = Join-Path $renderRoot "web.env"
          if (-not (Test-Path -LiteralPath $webTemplate)) {
            throw "Template-Datei fehlt: $webTemplate. Stelle sicher, dass im Deploy-Job 'actions/checkout' ausgeführt wurde."
          }
          Render-File -SourcePath $webTemplate -TargetPath $webTarget -Tokens @{
            "__APP_DOMAIN__" = $env:DEPLOY_APP_DOMAIN
            "__DEBUG__" = $env:DEPLOY_DEBUG
            "__DB_PROVIDER__" = $env:DEPLOY_DB_PROVIDER
            "__SQLITE_PATH__" = $env:DEPLOY_SQLITE_PATH
            "__POSTGRES_HOST__" = $env:DEPLOY_POSTGRES_HOST
            "__POSTGRES_PORT__" = $env:DEPLOY_POSTGRES_PORT
            "__POSTGRES_USER__" = $env:DEPLOY_POSTGRES_USER
            "__POSTGRES_DB__" = $env:DEPLOY_POSTGRES_DB
            "__POSTGRES_SSLMODE__" = $env:DEPLOY_POSTGRES_SSLMODE
            "__AUTH_MODE__" = $env:DEPLOY_AUTH_MODE
            "__OIDC_ISSUER__" = $env:DEPLOY_OIDC_ISSUER
            "__OIDC_CLIENT_ID__" = $env:DEPLOY_OIDC_CLIENT_ID
            "__OIDC_AUDIENCE__" = $env:DEPLOY_OIDC_AUDIENCE
            "__OIDC_WEB_SCOPE__" = $env:DEPLOY_OIDC_WEB_SCOPE
            "__OPENAI_MODEL__" = $env:DEPLOY_OPENAI_MODEL
            "__OPENAI_BASE_URL__" = $env:DEPLOY_OPENAI_BASE_URL
            "__DEV_USER_NAME__" = $env:DEPLOY_DEV_USER_NAME
            "__DEV_USER_EMAIL__" = $env:DEPLOY_DEV_USER_EMAIL
            "__POSTGRES_PASSWORD__" = $env:DEPLOY_POSTGRES_PASSWORD
            "__OIDC_CLIENT_SECRET__" = $env:DEPLOY_OIDC_CLIENT_SECRET
            "__OPENAI_API_KEY__" = $env:DEPLOY_OPENAI_API_KEY
            "__MCP_API_KEY__" = $env:DEPLOY_MCP_API_KEY
          }

          $mcpTemplate = Join-Path $env:GITHUB_WORKSPACE "deploy\iis\mcpsettings.json"
          $mcpTarget = Join-Path $renderRoot "mcpsettings.json"
          if (-not (Test-Path -LiteralPath $mcpTemplate)) {
            throw "Template-Datei fehlt: $mcpTemplate. Stelle sicher, dass im Deploy-Job 'actions/checkout' ausgeführt wurde."
          }
          Render-File -SourcePath $mcpTemplate -TargetPath $mcpTarget -Tokens @{
            "__MCP_SERVER_NAME__" = $env:DEPLOY_MCP_SERVER_NAME
            "__MCP_SERVER_VERSION__" = $env:DEPLOY_MCP_SERVER_VERSION
            "__MCP_UPSTREAM_API_BASE_URL__" = $env:DEPLOY_MCP_UPSTREAM_API_BASE_URL
            "__MCP_STDIO_ENABLED__" = $env:DEPLOY_MCP_STDIO_ENABLED
            "__MCP_HTTP_ENABLED__" = $env:DEPLOY_MCP_HTTP_ENABLED
            "__MCP_HTTP_URLS_JSON__" = $env:DEPLOY_MCP_HTTP_URLS_JSON
            "__MCP_OAUTH_ENABLED__" = $env:DEPLOY_MCP_OAUTH_ENABLED
            "__MCP_OAUTH_ISSUER__" = $env:DEPLOY_MCP_OAUTH_ISSUER
            "__MCP_OAUTH_AUDIENCE__" = $env:DEPLOY_MCP_OAUTH_AUDIENCE
            "__MCP_OAUTH_TOKEN_LIFETIME_MINUTES__" = $env:DEPLOY_MCP_OAUTH_TOKEN_LIFETIME_MINUTES
            "__MCP_OAUTH_CLIENT_ID__" = $env:DEPLOY_MCP_OAUTH_CLIENT_ID
            "__MCP_OAUTH_CLIENT_SCOPES_JSON__" = $env:DEPLOY_MCP_OAUTH_CLIENT_SCOPES_JSON
            "__MCP_API_KEY__" = $env:DEPLOY_MCP_API_KEY
            "__MCP_OAUTH_SIGNING_KEY__" = $env:DEPLOY_MCP_OAUTH_SIGNING_KEY
            "__MCP_OAUTH_CLIENT_SECRET__" = $env:DEPLOY_MCP_OAUTH_CLIENT_SECRET
          }

          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_MCP_API_KEY)) {
            throw "GitHub Secret 'MCP_API_KEY' fehlt."
          }

          $mcpConfig = Get-Content -LiteralPath $mcpTarget -Raw | ConvertFrom-Json
          if ($mcpConfig.oauth.enabled -eq $true) {
            if ([string]::IsNullOrWhiteSpace($env:DEPLOY_MCP_OAUTH_SIGNING_KEY)) {
              throw "GitHub Secret 'MCP_OAUTH_SIGNING_KEY' fehlt, obwohl OAuth im MCP-Config aktiviert ist."
            }
            if ($mcpConfig.oauth.clients.Count -gt 0 -and [string]::IsNullOrWhiteSpace($env:DEPLOY_MCP_OAUTH_CLIENT_SECRET)) {
              throw "GitHub Secret 'MCP_OAUTH_CLIENT_SECRET' fehlt, obwohl ein OAuth-Client konfiguriert ist."
            }
          }

      - name: Ensure IIS And Deployment Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Grant-DirectoryAccess {
            param(
              [string]$Path,
              [string]$Identity,
              [string]$Rights
            )

            & icacls.exe $Path /grant "${Identity}:${Rights}" /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Berechtigungen für '$Identity' auf '$Path' konnten nicht gesetzt werden."
            }
            $global:LASTEXITCODE = 0
          }

          foreach ($required in @("IIS_SITE_NAME", "IIS_APP_POOL", "IIS_PHYSICAL_PATH")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -Path "Env:$required").Value)) {
              throw "Pflichtvariable '$required' fehlt. Bitte Repository Variables konfigurieren."
            }
          }

          $iisService = Get-Service -Name W3SVC -ErrorAction SilentlyContinue
          if (-not $iisService) {
            if (-not (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue)) {
              throw "IIS fehlt und 'Install-WindowsFeature' ist auf diesem Runner nicht verfügbar. Entweder IIS vorinstallieren oder einen Windows-Server-Runner mit Admin-Rechten verwenden."
            }

            Install-WindowsFeature Web-Server, Web-Mgmt-Tools, Web-Scripting-Tools | Out-Null
            $iisService = Get-Service -Name W3SVC -ErrorAction SilentlyContinue
            if (-not $iisService) {
              throw "IIS konnte nicht installiert werden."
            }
          }

          Import-Module WebAdministration
          if (-not (Get-PSDrive -Name IIS -ErrorAction SilentlyContinue)) {
            throw "Das IIS PowerShell-Drive konnte nicht geladen werden. Prüfe, ob das Feature 'Web-Scripting-Tools' installiert ist."
          }

          $hostingModuleCandidates = @(
            "$env:ProgramFiles\IIS\Asp.Net Core Module\V2\aspnetcorev2.dll",
            "$env:ProgramFiles\IIS\Asp.Net Core Module\V2\OutOfProcessRequestHandler.dll"
          )
          $hostingModule = $hostingModuleCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $hostingModule) {
            if ([string]::IsNullOrWhiteSpace($env:ASPNETCORE_HOSTING_BUNDLE_URL)) {
              throw "ASP.NET Core Hosting Bundle / AspNetCoreModuleV2 fehlt. Setze 'ASPNETCORE_HOSTING_BUNDLE_URL' als Repository Variable oder installiere das Hosting Bundle vorab."
            }

            $bundlePath = Join-Path $env:PACKAGE_ROOT "dotnet-hosting-bundle.exe"
            Invoke-WebRequest -Uri $env:ASPNETCORE_HOSTING_BUNDLE_URL -OutFile $bundlePath -UseBasicParsing
            Start-Process -FilePath $bundlePath -ArgumentList "/quiet", "/norestart" -Wait

            $hostingModule = $hostingModuleCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $hostingModule) {
              throw "ASP.NET Core Hosting Bundle konnte nicht erfolgreich installiert werden."
            }
          }

          $runtimes = & dotnet --list-runtimes
          if (-not ($runtimes | Select-String -Pattern "^Microsoft\.AspNetCore\.App 10\.")) {
            if ([string]::IsNullOrWhiteSpace($env:ASPNETCORE_HOSTING_BUNDLE_URL)) {
              throw ".NET 10 ASP.NET Core Runtime fehlt auf dem IIS-Server."
            }

            $bundlePath = Join-Path $env:PACKAGE_ROOT "dotnet-hosting-bundle.exe"
            if (-not (Test-Path $bundlePath)) {
              Invoke-WebRequest -Uri $env:ASPNETCORE_HOSTING_BUNDLE_URL -OutFile $bundlePath -UseBasicParsing
            }
            Start-Process -FilePath $bundlePath -ArgumentList "/quiet", "/norestart" -Wait
            $runtimes = & dotnet --list-runtimes
            if (-not ($runtimes | Select-String -Pattern "^Microsoft\.AspNetCore\.App 10\.")) {
              throw ".NET 10 ASP.NET Core Runtime konnte nicht installiert werden."
            }
          }

          if ((Get-Service -Name W3SVC).Status -ne "Running") {
            Start-Service -Name W3SVC
          }

          if (-not (Test-Path -LiteralPath $env:IIS_PHYSICAL_PATH)) {
            New-Item -ItemType Directory -Path $env:IIS_PHYSICAL_PATH -Force | Out-Null
          }

          $keysPath = Join-Path $env:IIS_PHYSICAL_PATH "data\keys"
          if (-not (Test-Path -LiteralPath $keysPath)) {
            New-Item -ItemType Directory -Path $keysPath -Force | Out-Null
          }

          $logsPath = Join-Path $env:IIS_PHYSICAL_PATH "logs"
          if (-not (Test-Path -LiteralPath $logsPath)) {
            New-Item -ItemType Directory -Path $logsPath -Force | Out-Null
          }

          if (-not [string]::IsNullOrWhiteSpace($env:MCP_PHYSICAL_PATH)) {
            if (-not (Test-Path -LiteralPath $env:MCP_PHYSICAL_PATH)) {
              New-Item -ItemType Directory -Path $env:MCP_PHYSICAL_PATH -Force | Out-Null
            }
          }

          $port = if ([string]::IsNullOrWhiteSpace($env:IIS_PORT)) { 80 } else { [int]$env:IIS_PORT }
          $hostHeader = if ([string]::IsNullOrWhiteSpace($env:IIS_HOST_HEADER)) { "" } else { $env:IIS_HOST_HEADER.Trim() }
          if ($hostHeader -in @('""', "''")) {
            $hostHeader = ""
          }

          if (Test-Path "IIS:\Sites\$env:IIS_SITE_NAME") {
            try {
              Stop-Website -Name $env:IIS_SITE_NAME -ErrorAction SilentlyContinue
            }
            catch {
              Write-Warning "Stop-Website vor Neuerstellung fehlgeschlagen: $($_.Exception.Message)"
            }
            Remove-Website -Name $env:IIS_SITE_NAME
            Start-Sleep -Seconds 2
          }

          if (Test-Path "IIS:\AppPools\$env:IIS_APP_POOL") {
            try {
              if ((Get-WebAppPoolState -Name $env:IIS_APP_POOL).Value -ne "Stopped") {
                Stop-WebAppPool -Name $env:IIS_APP_POOL
                Start-Sleep -Seconds 2
              }
            }
            catch {
              Write-Warning "Stop-WebAppPool vor Neuerstellung fehlgeschlagen: $($_.Exception.Message)"
            }

            Remove-WebAppPool -Name $env:IIS_APP_POOL
            Start-Sleep -Seconds 2
          }

          New-Item "IIS:\AppPools\$env:IIS_APP_POOL" | Out-Null
          Set-ItemProperty "IIS:\AppPools\$env:IIS_APP_POOL" -Name managedRuntimeVersion -Value ""
          Set-ItemProperty "IIS:\AppPools\$env:IIS_APP_POOL" -Name processModel.identityType -Value ApplicationPoolIdentity

          New-Website -Name $env:IIS_SITE_NAME -PhysicalPath $env:IIS_PHYSICAL_PATH -ApplicationPool $env:IIS_APP_POOL -Port $port -IPAddress "*" -HostHeader $hostHeader | Out-Null

          $appPoolIdentity = "IIS AppPool\$($env:IIS_APP_POOL)"
          Grant-DirectoryAccess -Path $env:IIS_PHYSICAL_PATH -Identity "NT AUTHORITY\SYSTEM" -Rights "(OI)(CI)(F)"
          Grant-DirectoryAccess -Path $env:IIS_PHYSICAL_PATH -Identity "BUILTIN\Administrators" -Rights "(OI)(CI)(F)"
          Grant-DirectoryAccess -Path $env:IIS_PHYSICAL_PATH -Identity $appPoolIdentity -Rights "(OI)(CI)(M)"

          if (-not [string]::IsNullOrWhiteSpace($env:MCP_PHYSICAL_PATH)) {
            Grant-DirectoryAccess -Path $env:MCP_PHYSICAL_PATH -Identity "NT AUTHORITY\SYSTEM" -Rights "(OI)(CI)(F)"
            Grant-DirectoryAccess -Path $env:MCP_PHYSICAL_PATH -Identity "BUILTIN\Administrators" -Rights "(OI)(CI)(F)"
          }

      - name: Install Web Deployment Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module WebAdministration

          $package = Get-ChildItem -Path "$env:PACKAGE_ROOT\web" -Filter *.zip | Select-Object -First 1
          if (-not $package) {
            throw "Web-Deployment-Paket wurde nicht gefunden."
          }

          $extractPath = Join-Path $env:PACKAGE_ROOT "expanded"
          $backupRoot = Join-Path $env:PACKAGE_ROOT "backup"
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $backupPath = Join-Path $backupRoot $timestamp

          if (Test-Path -LiteralPath $extractPath) {
            Remove-Item -LiteralPath $extractPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
          Expand-Archive -LiteralPath $package.FullName -DestinationPath $extractPath -Force

          if ((Get-WebAppPoolState -Name $env:IIS_APP_POOL).Value -ne "Stopped") {
            Stop-WebAppPool -Name $env:IIS_APP_POOL
          }

          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null
          if (Test-Path -LiteralPath $env:IIS_PHYSICAL_PATH) {
            robocopy $env:IIS_PHYSICAL_PATH $backupPath /E /NFL /NDL /NJH /NJS /NP | Out-Null
            $backupRobocopyExit = $LASTEXITCODE
            if ($backupRobocopyExit -gt 7) {
              throw "Backup-Robocopy fehlgeschlagen mit Exit-Code $backupRobocopyExit."
            }
            $global:LASTEXITCODE = 0
          }

          robocopy $extractPath $env:IIS_PHYSICAL_PATH /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -gt 7) {
            throw "Robocopy fehlgeschlagen mit Exit-Code $robocopyExit."
          }
          $global:LASTEXITCODE = 0

          $repoEnvFile = Join-Path $env:PACKAGE_ROOT "rendered-config\web.env"
          if (Test-Path -LiteralPath $repoEnvFile) {
            Copy-Item -LiteralPath $repoEnvFile -Destination (Join-Path $env:IIS_PHYSICAL_PATH ".env") -Force
          }

          if ((Get-Service -Name W3SVC).Status -ne "Running") {
            Start-Service -Name W3SVC
          }

          $site = Get-Website -Name $env:IIS_SITE_NAME -ErrorAction Stop
          $appPool = Get-Item "IIS:\AppPools\$env:IIS_APP_POOL" -ErrorAction Stop
          Write-Host "=== IIS site diagnostic ==="
          $site | Format-List Name, Id, State, PhysicalPath, ApplicationPool, Bindings | Out-String | Write-Host
          Write-Host "=== IIS app pool diagnostic ==="
          $appPool | Format-List Name, State, managedRuntimeVersion | Out-String | Write-Host

          if ((Get-WebAppPoolState -Name $env:IIS_APP_POOL).Value -ne "Started") {
            try {
              Start-WebAppPool -Name $env:IIS_APP_POOL
            }
            catch {
              Write-Warning "Start-WebAppPool fehlgeschlagen: $($_.Exception.Message)"
            }
          }

          Start-Sleep -Seconds 3
          $finalAppPoolState = (Get-WebAppPoolState -Name $env:IIS_APP_POOL).Value
          Write-Host "=== IIS app pool state after start attempt ==="
          Write-Host $finalAppPoolState

          if ($finalAppPoolState -ne "Started") {
            Write-Host "=== Recent Application log entries ==="
            Get-WinEvent -LogName Application -MaxEvents 80 |
              Where-Object {
                $_.ProviderName -in @(
                  "IIS-W3SVC-WP",
                  "IIS-W3SVC",
                  "Microsoft-Windows-WAS",
                  "IIS AspNetCore Module V2",
                  "Application Error",
                  ".NET Runtime"
                )
              } |
              Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String | Write-Host

            $stdoutLogRoot = Join-Path $env:IIS_PHYSICAL_PATH "logs"
            if (Test-Path -LiteralPath $stdoutLogRoot) {
              Write-Host "=== Application stdout logs ==="
              Get-ChildItem -LiteralPath $stdoutLogRoot -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 5 |
                ForEach-Object {
                  Write-Host "--- $($_.FullName) ---"
                  Get-Content -LiteralPath $_.FullName -Tail 200 -ErrorAction SilentlyContinue
                }
            }

            throw "Application Pool '$($env:IIS_APP_POOL)' konnte nicht gestartet werden oder ist direkt wieder gestoppt."
          }

          $siteState = (Get-Website -Name $env:IIS_SITE_NAME).State
          if ($siteState -ne "Started") {
            try {
              Start-Website -Name $env:IIS_SITE_NAME
            }
            catch {
              Write-Warning "Start-Website fehlgeschlagen: $($_.Exception.Message)"
              $appcmd = Join-Path $env:WinDir "System32\inetsrv\appcmd.exe"
              if (-not (Test-Path -LiteralPath $appcmd)) {
                throw
              }

              & $appcmd start site /site.name:"$($env:IIS_SITE_NAME)"
              if ($LASTEXITCODE -ne 0) {
                throw "Start der IIS-Website '$($env:IIS_SITE_NAME)' ist fehlgeschlagen. appcmd Exit-Code: $LASTEXITCODE"
              }
              $global:LASTEXITCODE = 0
            }
          }

          $finalSiteState = (Get-Website -Name $env:IIS_SITE_NAME).State
          if ($finalSiteState -ne "Started") {
            throw "IIS-Website '$($env:IIS_SITE_NAME)' konnte nicht gestartet werden. Endstatus: $finalSiteState"
          }

          $global:LASTEXITCODE = 0

      - name: Install MCP Deployment Package
        if: ${{ env.MCP_PHYSICAL_PATH != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Get-ChildItem -Path "$env:PACKAGE_ROOT\mcp" -Filter *.zip | Select-Object -First 1
          if (-not $package) {
            throw "MCP-Deployment-Paket wurde nicht gefunden."
          }

          $extractPath = Join-Path $env:PACKAGE_ROOT "expanded-mcp"
          $backupRoot = Join-Path $env:PACKAGE_ROOT "backup-mcp"
          $stateRoot = Join-Path $env:PACKAGE_ROOT "state-mcp"
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $backupPath = Join-Path $backupRoot $timestamp
          $preservedConfig = Join-Path $stateRoot "mcpsettings.json"
          $taskName = if ([string]::IsNullOrWhiteSpace($env:MCP_SERVICE_NAME)) { "LearnCardsMcpServer" } else { $env:MCP_SERVICE_NAME.Trim() }

          if (Test-Path -LiteralPath $extractPath) {
            Remove-Item -LiteralPath $extractPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
          Expand-Archive -LiteralPath $package.FullName -DestinationPath $extractPath -Force

          if (Test-Path -LiteralPath $stateRoot) {
            Remove-Item -LiteralPath $stateRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stateRoot -Force | Out-Null

          cmd.exe /c "schtasks /End /TN ""$taskName"" >nul 2>nul"
          $global:LASTEXITCODE = 0

          $mcpProcesses = Get-CimInstance Win32_Process -Filter "Name = 'LearnCards.McpServer.exe'" -ErrorAction SilentlyContinue
          foreach ($process in @($mcpProcesses)) {
            if ($process.ExecutablePath -and $process.ExecutablePath.StartsWith($env:MCP_PHYSICAL_PATH, [System.StringComparison]::OrdinalIgnoreCase)) {
              Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2

          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null
          if (Test-Path -LiteralPath $env:MCP_PHYSICAL_PATH) {
            robocopy $env:MCP_PHYSICAL_PATH $backupPath /E /NFL /NDL /NJH /NJS /NP | Out-Null
            $backupRobocopyExit = $LASTEXITCODE
            if ($backupRobocopyExit -gt 7) {
              throw "MCP-Backup-Robocopy fehlgeschlagen mit Exit-Code $backupRobocopyExit."
            }
            $global:LASTEXITCODE = 0
            $existingConfig = Join-Path $env:MCP_PHYSICAL_PATH "mcpsettings.json"
            if (Test-Path -LiteralPath $existingConfig) {
              Copy-Item -LiteralPath $existingConfig -Destination $preservedConfig -Force
            }
          }

          robocopy $extractPath $env:MCP_PHYSICAL_PATH /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -gt 7) {
            throw "MCP-Robocopy fehlgeschlagen mit Exit-Code $robocopyExit."
          }
          $global:LASTEXITCODE = 0

          $repoMcpConfig = Join-Path $env:PACKAGE_ROOT "rendered-config\mcpsettings.json"
          $targetConfig = Join-Path $env:MCP_PHYSICAL_PATH "mcpsettings.json"
          if (Test-Path -LiteralPath $repoMcpConfig) {
            Copy-Item -LiteralPath $repoMcpConfig -Destination $targetConfig -Force
          }
          elseif (Test-Path -LiteralPath $preservedConfig) {
            Copy-Item -LiteralPath $preservedConfig -Destination $targetConfig -Force
          }
          elseif (-not (Test-Path -LiteralPath $targetConfig)) {
            $exampleConfig = Join-Path $env:MCP_PHYSICAL_PATH "mcpsettings.example.json"
            if (Test-Path -LiteralPath $exampleConfig) {
              Copy-Item -LiteralPath $exampleConfig -Destination $targetConfig -Force
            }
          }

          $global:LASTEXITCODE = 0

      - name: Create MCP Client Launcher
        if: ${{ env.MCP_PHYSICAL_PATH != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $apiBase = if ([string]::IsNullOrWhiteSpace($env:IIS_BINDING_URL)) {
            "http://localhost/api"
          }
          else {
            ($env:IIS_BINDING_URL.TrimEnd('/')) + "/api"
          }

          $launcherPath = Join-Path $env:MCP_PHYSICAL_PATH "learncards-mcp.cmd"
          $launcherContent = @"
          @echo off
          setlocal
          if "%%LEARNCARDS_API_URL%%"=="" set "LEARNCARDS_API_URL=$apiBase"
          if "%%LEARNCARDS_MCP_API_KEY%%"=="" if not "%%MCP_API_KEY%%"=="" set "LEARNCARDS_MCP_API_KEY=%%MCP_API_KEY%%"
          "%~dp0LearnCards.McpServer.exe"
          "@
          Set-Content -LiteralPath $launcherPath -Value $launcherContent -Encoding ASCII

          $serviceLauncherPath = Join-Path $env:MCP_PHYSICAL_PATH "learncards-mcp-http.cmd"
          $serviceLauncherContent = @"
          @echo off
          setlocal
          if "%%LEARNCARDS_API_URL%%"=="" set "LEARNCARDS_API_URL=$apiBase"
          if "%%LEARNCARDS_MCP_API_KEY%%"=="" if not "%%MCP_API_KEY%%"=="" set "LEARNCARDS_MCP_API_KEY=%%MCP_API_KEY%%"
          set "LEARNCARDS_MCP_CONFIG=%~dp0mcpsettings.json"
          "%~dp0LearnCards.McpServer.exe"
          "@
          Set-Content -LiteralPath $serviceLauncherPath -Value $serviceLauncherContent -Encoding ASCII

          $configPath = Join-Path $env:MCP_PHYSICAL_PATH "claude-desktop.learncards.json"
          $config = @{
            mcpServers = @{
              learncards = @{
                command = $launcherPath
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -LiteralPath $configPath -Value $config -Encoding UTF8

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## MCP client launcher"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Launcher: {0}" -f $launcherPath)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Service launcher: {0}" -f $serviceLauncherPath)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Claude Desktop snippet: {0}" -f $configPath)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Default API URL fallback: {0}" -f $apiBase)

      - name: Configure MCP Background Task
        if: ${{ env.MCP_PHYSICAL_PATH != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Grant-DirectoryAccess {
            param(
              [string]$Path,
              [string]$Identity,
              [string]$Rights
            )

            & icacls.exe $Path /grant "${Identity}:${Rights}" /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Berechtigungen für '$Identity' auf '$Path' konnten nicht gesetzt werden."
            }
            $global:LASTEXITCODE = 0
          }

          $taskName = if ([string]::IsNullOrWhiteSpace($env:MCP_SERVICE_NAME)) { "LearnCardsMcpServer" } else { $env:MCP_SERVICE_NAME.Trim() }
          $configPath = Join-Path $env:MCP_PHYSICAL_PATH "mcpsettings.json"
          if (-not (Test-Path -LiteralPath $configPath)) {
            Write-Host "mcpsettings.json fehlt. Geplante MCP-Aufgabe wird nicht angelegt."
            exit 0
          }

          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $httpEnabled = $false
          if ($null -ne $config.transports -and $null -ne $config.transports.http -and $config.transports.http.enabled -eq $true) {
            $httpEnabled = $true
          }

          if (-not $httpEnabled) {
            cmd.exe /c "schtasks /Delete /TN ""$taskName"" /F >nul 2>nul"
            $global:LASTEXITCODE = 0
            $processes = Get-CimInstance Win32_Process -Filter "Name = 'LearnCards.McpServer.exe'" -ErrorAction SilentlyContinue
            foreach ($process in @($processes)) {
              if ($process.ExecutablePath -and $process.ExecutablePath.StartsWith($env:MCP_PHYSICAL_PATH, [System.StringComparison]::OrdinalIgnoreCase)) {
                Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
              }
            }
            Write-Host "HTTP-Transport ist deaktiviert. Geplante MCP-Aufgabe wird nicht verwendet."
            exit 0
          }

          $serviceLauncherPath = Join-Path $env:MCP_PHYSICAL_PATH "learncards-mcp-http.cmd"
          if (-not (Test-Path -LiteralPath $serviceLauncherPath)) {
            throw "MCP-Service-Launcher wurde nicht gefunden: $serviceLauncherPath"
          }

          $bootstrapPath = Join-Path $env:MCP_PHYSICAL_PATH "start-mcp-http.ps1"
          $bootstrapScript = @"
          `$ErrorActionPreference = 'Stop'
          `$root = '$($env:MCP_PHYSICAL_PATH.Replace("'", "''"))'
          `$launcher = Join-Path `$root 'learncards-mcp-http.cmd'
          `$exePath = Join-Path `$root 'LearnCards.McpServer.exe'

          `$processes = Get-CimInstance Win32_Process -Filter "Name = 'LearnCards.McpServer.exe'" -ErrorAction SilentlyContinue
          foreach (`$process in @(`$processes)) {
            if (`$process.ExecutablePath -and `$process.ExecutablePath.StartsWith(`$root, [System.StringComparison]::OrdinalIgnoreCase)) {
              Stop-Process -Id `$process.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Test-Path -LiteralPath `$launcher)) {
            throw "Launcher fehlt: `$launcher"
          }

          Start-Process -FilePath `$launcher -WorkingDirectory `$root -WindowStyle Hidden
          "@
          Set-Content -LiteralPath $bootstrapPath -Value $bootstrapScript -Encoding UTF8

          cmd.exe /c "schtasks /Delete /TN ""$taskName"" /F >nul 2>nul"
          $global:LASTEXITCODE = 0
          $taskCommand = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "' + $bootstrapPath + '"'
          & schtasks.exe /Create /F /SC ONSTART /RU SYSTEM /RL HIGHEST /TN $taskName /TR $taskCommand | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Geplante Aufgabe '$taskName' konnte nicht angelegt werden."
          }
          $global:LASTEXITCODE = 0

          Grant-DirectoryAccess -Path $env:MCP_PHYSICAL_PATH -Identity "NT AUTHORITY\SYSTEM" -Rights "(OI)(CI)(M)"

          & schtasks.exe /Run /TN $taskName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Geplante MCP-Aufgabe '$taskName' konnte nicht gestartet werden."
          }
          $global:LASTEXITCODE = 0

          Start-Sleep -Seconds 3
          $startedProcess = Get-CimInstance Win32_Process -Filter "Name = 'LearnCards.McpServer.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($env:MCP_PHYSICAL_PATH, [System.StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1
          if (-not $startedProcess) {
            throw "MCP-Prozess wurde nicht gestartet."
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## MCP background task"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Task: {0}" -f $taskName)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Config: {0}" -f $configPath)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Launcher: {0}" -f $serviceLauncherPath)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("- Bootstrap: {0}" -f $bootstrapPath)

      - name: Verify Deployment
        if: ${{ env.IIS_BINDING_URL != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseUri = [Uri]$env:IIS_BINDING_URL
          $port = if ([string]::IsNullOrWhiteSpace($env:IIS_PORT)) { $baseUri.Port } else { [int]$env:IIS_PORT }
          $builder = [System.UriBuilder]::new($baseUri)
          $builder.Port = $port
          $builder.Path = "/health"
          $builder.Query = ""
          $healthUrl = $builder.Uri.AbsoluteUri
          $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
            throw "Health-Check fehlgeschlagen: $($response.StatusCode)"
          }

      - name: Verify MCP HTTP Service
        if: ${{ env.MCP_PHYSICAL_PATH != '' && env.MCP_HTTP_HEALTH_URL != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $response = Invoke-WebRequest -Uri $env:MCP_HTTP_HEALTH_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
            throw "MCP-Health-Check fehlgeschlagen: $($response.StatusCode)"
          }
