<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="Learny Verified – Digitally Signed Credential">
  <title>Learny Verified – Digitally Signed Credential</title>
  <style>
    :root { --ring: #1d8379; --fill: #1d8379; --check: #ffffff; --title: #1d8379; --sub: #596564; }
    @media (prefers-color-scheme: dark) { :root { --ring: #5fd0c3; --fill: #2aa79b; --check: #0b1f1d; --title: #5fd0c3; --sub: #b8c7c5; } }
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; }
  </style>
  <circle cx="32" cy="32" r="28" fill="none" stroke="var(--ring)" stroke-width="5"/>
  <circle cx="32" cy="32" r="21" fill="var(--fill)"/>
  <path d="M21 33.5l8 8 15-17" fill="none" stroke="var(--check)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="31" font-size="23" font-weight="700" fill="var(--title)">Learny Verified</text>
  <text x="72" y="49" font-size="12.5" fill="var(--sub)">Digitally Signed Credential</text>
</svg>
